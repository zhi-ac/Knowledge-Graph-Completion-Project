<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关系管理 - 知识图谱补全系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Microsoft YaHei', Arial, sans-serif;
        }
        .main-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            margin: 20px auto;
            max-width: 1200px;
            padding: 30px;
        }
        .header {
            text-align: center;
            background: linear-gradient(45deg, #4e54c8, #8f94fb);
            color: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
        }
        .nav-link {
            color: white;
            text-decoration: none;
            margin: 0 10px;
            padding: 8px 16px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }
        .nav-link:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }
        .nav-link.active {
            background: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="main-container">
            <!-- 导航栏 -->
            <div class="header">
                <h1>[RELATION] 关系管理</h1>
                <p class="lead mb-0">管理和查看知识图谱中的所有关系类型</p>
                <nav class="mt-3">
                    <a href="/" class="nav-link">[HOME] 主页</a>
                    <a href="/entity-management" class="nav-link">[ENTITY] 实体管理</a>
                    <a href="/relation-management" class="nav-link active">[RELATION] 关系管理</a>
                    <a href="/triple-management" class="nav-link">[TRIPLE] 三元组管理</a>
                    <a href="/model-management" class="nav-link">[MODEL] 模型训练</a>
                    <a href="/data-management" class="nav-link">[DATA] 数据管理</a>
                    <a href="/analysis" class="nav-link">[ANALYSIS] 补全分析</a>
                </nav>
            </div>
            <!-- 主要内容 -->
            <div class="row">
                <div class="col-12">
                    <div class="card">
                        <div class="card-header">
                            <h5>知识图谱状态</h5>
                        </div>
                        <div class="card-body">
                            <div id="statusDiv">
                                <p>正在检查状态...</p>
                            </div>
                            <div class="mt-3">
                                <button class="btn btn-primary" onclick="initKG()">初始化知识图谱</button>
                                <button class="btn btn-success ms-2" onclick="loadRelations()">加载关系列表</button>
                                <button class="btn btn-warning ms-2" onclick="showAddRelationModal()">添加关系</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row mt-4">
                <div class="col-12">
                    <div class="card">
                        <div class="card-header">
                            <h5>关系列表</h5>
                        </div>
                        <div class="card-body">
                            <div id="relationsList">
                                <p>请先初始化知识图谱</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function loadRelations() {
            fetch('/api/kg/relations')
                .then(response => response.json())
                .then(data => {
                    const relations = data.relations || data || [];
                    displayRelations(relations);
                })
                .catch(error => {
                    console.error('加载关系失败:', error);
                });
        }

        function displayRelations(relations) {
            const container = document.getElementById('relationsList');
            container.innerHTML = '';

            if (relations.length === 0) {
                container.innerHTML = '<p>暂无关系数据</p>';
                return;
            }

            const listHtml = relations.map(relation => 
                `<div class="card mb-2">
                    <div class="card-body">
                        <h6>${relation.name}</h6>
                        <p class="mb-0 text-muted">${relation.description || '暂无描述'}</p>
                    </div>
                </div>`
            ).join('');
            
            container.innerHTML = listHtml;
        }

        function initKG() {
            fetch('/api/kg/init', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({})
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    showAlert('知识图谱初始化成功', 'success');
                    loadRelations();
                } else {
                    showAlert('初始化失败: ' + (data.message || '未知错误'), 'danger');
                }
            })
            .catch(error => {
                console.error('初始化失败:', error);
                showAlert('初始化失败', 'danger');
            });
        }

        function showAddRelationModal() {
            const relationName = prompt('请输入关系名称:');
            if (relationName) {
                addRelation(relationName);
            }
        }

        function addRelation(name) {
            showAlert('添加关系功能暂未实现', 'info');
        }

        function showAlert(message, type) {
            const statusDiv = document.getElementById('statusDiv');
            statusDiv.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
        }

        // 页面加载时检查状态
        document.addEventListener('DOMContentLoaded', function() {
            fetch('/api/database/status')
                .then(response => response.json())
                .then(data => {
                    const statusDiv = document.getElementById('statusDiv');
                    statusDiv.innerHTML = `<p>知识图谱状态: ${data.status || '未初始化'}</p>`;
                });
        });
    </script>
</body>
</html>
